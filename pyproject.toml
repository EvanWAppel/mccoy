[project]
name = "mccoy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=4.4.1",
    "dash-cytoscape>=1.0.2",
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "musicbrainzngs>=0.7.1",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "python3-discogs-client>=2.9",
    "spotipy>=2.26.0",
]

[tool.ruff]
# House rule (CLAUDE.md): keep lines under 80 chars.
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before importing modules that read env at
# import time, so app.py's imports are intentionally not all at top.
"app.py" = ["E402"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "responses>=0.26.2",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
