name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Throwaway Postgres for the play-history pipeline tests
      # (raw_plays upserts + dbt models). Tests create their own DB.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Fail rather than skip if the Postgres tests can't run here.
      REQUIRE_PG_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      # ty is advisory for now: its inference on Dash/Flask types
      # produces mostly false positives, so it runs and is visible but
      # does not gate the build. Tighten to blocking once the type
      # story matures.
      - name: Typecheck (ty, advisory)
        continue-on-error: true
        run: >-
          uv run ty check
          app.py auth.py spotify.py db.py demo_data.py snapshot.py
          components netviz scripts
      - name: Test (pytest)
        run: uv run pytest -q
